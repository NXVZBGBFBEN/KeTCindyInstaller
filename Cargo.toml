[package]
name = "ketcindyinstaller"
version = "0.2.0"
authors = ["NXVZBGBFBEN <nxvzbgbfben@gmail.com>"]
edition = "2021"
description = "Cross-platform installer for KeTCindy"

[dependencies]
anyhow = "1.0.100"
eframe = "0.31.1"
env_logger = "0.11.7"
log = "0.4.27"
octocrab = "0.44.0"
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }
